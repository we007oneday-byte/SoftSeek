[versions]
agp = "8.9.0"
kotlin = "2.0.20"
coreKtx = "1.13.1"
activityCompose = "1.9.2"
lifecycle = "2.8.4"
composeBom = "2024.10.01"
navigationCompose = "2.7.7"
splashscreen = "1.0.1"
junit = "4.13.2"
